[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "namae"
version = "0.1.0"
description = "DNS resolver built from scratch"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]